name: Build Android APK

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Download jniLibs
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        # Fetch the prebuilt jniLibs ZIP from the tag v4.2.2 of the upstream repository
        curl -L -o jniLibs.zip https://github.com/Cateners/tiny_container/releases/download/v4.2.2/jniLibs.zip
        unzip jniLibs.zip -d app/src/main/jniLibs/arm64-v8a
        rm jniLibs.zip

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
